try{await st.set('ms',S.ms);render()}catch(e){S.ms=old;say('Не удалось сохранить.')}};
A.start=d=>{const n=d.n||($('#wn')&&$('#wn').value.trim())||'Тренировка';S.act={n:n.slice(0,30),st:Date.now(),ex:[],note:''};S.rest=0;saveAct();render()};
A.rep=d=>{const w=S.tr[d.d][+d.i];S.act={n:w.n,st:Date.now(),ex:w.ex.map(e=>({n:e.n,s:e.s.map(s=>({w:s.w,r:s.r,k:0}))})),note:''};S.rest=0;saveAct();render()};
A.pk=()=>{S.pick={g:GR[0]};render()};A.pg=d=>{S.pick.g=d.g;render()};A.pc=()=>{S.pick=null;render()};
A.ae=d=>{S.act.ex.push({n:d.n,s:prefill(d.n)});S.pick=null;saveAct();render()};
A.ce=()=>{const n=$('#cn').value.trim().slice(0,40);if(!n)return;S.lib.push({n,g:S.pick.g,q:'своё'});st.set('lib',S.lib).catch(()=>{});A.ae({n})};
A.tk=d=>{const s=S.act.ex[+d.i].s[+d.j];s.k=s.k?0:1;if(s.k)S.rest=Date.now();saveAct();render()};
A.as=d=>{const e=S.act.ex[+d.i],l=e.s[e.s.length-1]||{};e.s.push({w:l.w||'',r:l.r||'',k:0});saveAct();render()};
A.ds=d=>{S.act.ex[+d.i].s.splice(+d.j,1);saveAct();render()};
A.de=d=>{S.act.ex.splice(+d.i,1);saveAct();render()};
A.can=()=>ask('Отменить тренировку?',ok=>{if(!ok)return;clearTimeout(tmr);S.act=null;st.set('tr_active',null).catch(()=>{});render()});
A.fin=async()=>{const a=S.act,ex=a.ex.map(e=>({n:e.n,s:e.s.filter(s=>s.k&&n0(s.r)>0).map(s=>({w:n0(s.w),r:n0(s.r)}))})).filter(e=>e.s.length);
if(!ex.length){say('Отметьте ✓ хотя бы один выполненный подход.');return}
const bm=bestMap(),prs=[];ex.forEach(e=>{const x=Math.max(...e.s.map(s=>s.w*(1+s.r/30)));if(bm[e.n]&&x>bm[e.n].x+.01)prs.push(e.n)});
const w={id:Date.now(),n:a.n,min:Math.max(1,Math.round((Date.now()-a.st)/6e4)),ex,note:(a.note||'').slice(0,80)},d=today(),old=S.tr[d];S.tr[d]=(old||[]).concat(w);
try{await st.set('tr_'+d,S.tr[d]);clearTimeout(tmr);S.act=null;st.set('tr_active',null).catch(()=>{});render();say('Тренировка сохранена. Объём: '+Math.round(vol(w))+' кг.'+(prs.length?'\n🏆 Новые рекорды: '+prs.join(', '):''))}catch(e){if(old)S.tr[d]=old;else delete S.tr[d];say('Не удалось сохранить тренировку.')}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset,t)});
document.addEventListener('input',e=>{const t=e.target;if(!S.act)return;if(t.dataset.f){S.act.ex[+t.dataset.i].s[+t.dataset.j][t.dataset.f]=t.value;saveAct()}else if(t.id==='note'){S.act.note=t.value;saveAct()}});
setInterval(()=>{if(S.act&&S.tab==='train'&&!S.pick&&$('#tm')){$('#tm').textContent=mm(Date.now()-S.act.st);$('#rt').textContent=S.rest?mm(Date.now()-S.rest):'—'}},1000);
load().then(render).catch(render);
})();
</script></body></html>
