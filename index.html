A.wa=async d=>{S.wt=Math.max(0,S.wt+ +d.v);render();st.set('wt_'+today(),S.wt).catch(()=>{})};
A.fadd=()=>{S.tab='food';S.date=today();S.ed={meal:'breakfast'};S.view='ff';render()};
A.fm=d=>{S.ed={meal:d.m};S.view='ff';render()};
A.fe=d=>{S.ed=(S.fd[S.date]||[]).find(e=>e.id==d.id);S.view='ff';render()};
A.fc=()=>{S.view=null;S.ed=null;render()};
A.rc=d=>{const r=recents()[+d.i];$('#e_n').value=r.name;$('#e_g').value=r.g||'';$('#e_k').value=r.kcal;$('#e_p').value=r.p;$('#e_f').value=r.f;$('#e_c').value=r.c};
A.fs=async()=>{const g=i=>$('#'+i).value,er=$('#err'),n=g('e_n').trim(),k=num(g('e_k')),x={g:n0(g('e_g')),p:n0(g('e_p')),f:n0(g('e_f')),c:n0(g('e_c'))};
if(!n){er.textContent='Введите название.';return}
if(!(k>=0&&k<=5000)){er.textContent='Калории: 0–5000.';return}
if(x.g<0||x.p<0||x.f<0||x.c<0||x.g>5000||x.p>500||x.f>500||x.c>1000){er.textContent='Проверьте граммы и БЖУ.';return}
const en={id:S.ed.id||Date.now(),meal:g('e_m'),name:n.slice(0,40),g:Math.round(x.g),kcal:Math.round(k),p:r1(x.p),f:r1(x.f),c:r1(x.c)},old=S.fd[S.date]||[];
S.fd[S.date]=S.ed.id?old.map(e=>e.id===en.id?en:e):old.concat(en);
try{await st.set('f_'+S.date,S.fd[S.date]);S.view=null;S.ed=null;render()}catch(e){S.fd[S.date]=old;er.textContent='Не удалось сохранить.'}};
A.fx=()=>ask('Удалить запись?',async ok=>{if(!ok)return;const old=S.fd[S.date];S.fd[S.date]=old.filter(e=>e.id!==S.ed.id);try{await st.set('f_'+S.date,S.fd[S.date]);S.view=null;S.ed=null;render()}catch(e){S.fd[S.date]=old;say('Не удалось удалить.')}});
const sd=async d=>{if(!(d in S.fd))S.fd[d]=(await st.get('f_'+d))||[];S.date=d;render()};
A.dp=()=>sd(addD(S.date,-1));A.dn=()=>{if(S.date<today())sd(addD(S.date,1))};
A.wsv=async()=>{const er=$('#err'),v=num($('#w_i').value);if(!(v>=30&&v<=300)){er.textContent='Вес: 30–300 кг.';return}const old=S.W;S.W=old.filter(e=>e.d!==today()).concat({d:today(),w:r1(v)}).sort((a,b)=>a.d<b.d?-1:1);try{await saveW();render()}catch(e){S.W=old;er.textContent='Не удалось сохранить.'}};
A.wp=d=>{S.per=d.p;render()};
A.wd=d=>ask('Удалить запись?',async ok=>{if(!ok)return;const old=S.W;S.W=old.filter(e=>e.d!==d.d);try{await saveW();render()}catch(e){S.W=old;say('Не удалось удалить.')}});
A.msv=async()=>{const v={};MF.forEach(([k])=>{const x=num($('#m_'+k).value);if(x>0&&x<300)v[k]=x});if(!Object.keys(v).length){say('Введите хотя бы один замер.');return}
const e0=S.ms.find(e=>e.d===today()),old=S.ms;S.ms=S.ms.filter(e=>e.d!==today()).concat({d:today(),v:{...(e0?e0.v:{}),...v}}).slice(-30);
try{await st.set('ms',S.ms);render()}catch(e){S.ms=old;say('Не удалось сохранить.')}};
const startT=t=>{S.act={n:t.n,st:Date.now(),ex:t.ex.map(e=>({n:e.n,s:e.s.map(s=>({w:s.w,r:s.r,k:0}))})),note:''};S.rest=0;saveAct()};
A.start=()=>{const n=($('#wn')&&$('#wn').value.trim())||'Тренировка';S.act={n:n.slice(0,30),st:Date.now(),ex:[],note:''};S.rest=0;saveAct();render()};
A.sp=d=>{const t=S.tpl.find(x=>x.id==d.id);if(!t)return;if(S.act)return A.go({t:'train'});startT(t);S.tab='train';S.view=null;render()};
A.rep=d=>{const w=(S.tr[d.d]||[]).find(x=>x.id==d.id);if(!w)return;if(S.act)return say('Сначала завершите текущую тренировку.');startT(w);S.tab='train';render()};
A.wdel=d=>ask('Удалить эту тренировку?',async ok=>{if(!ok)return;const old=S.tr[d.d]||[];S.tr[d.d]=old.filter(x=>x.id!=d.id);try{await st.set('tr_'+d.d,S.tr[d.d]);render()}catch(e){S.tr[d.d]=old;say('Не удалось удалить.')}});
A.pa=async d=>{const v=$('#pl').value,wd=pd(S.cd).getDay(),old=JSON.stringify(S.plan);
if(d.s==='d'){if(v==='')delete S.plan.dt[S.cd];else S.plan.dt[S.cd]=+v}else{if(v===''||v==='0')delete S.plan.wd[wd];else S.plan.wd[wd]=+v;delete S.plan.dt[S.cd]}
try{await st.set('plan',S.plan);render()}catch(e){S.plan=JSON.parse(old);say('Не удалось сохранить.')}};
A.tn=()=>{S.te={n:'',ex:[]};S.view='te';render()};
A.te=d=>{const t=S.tpl.find(x=>x.id==d.id);S.te=JSON.parse(JSON.stringify(t));S.view='te';render()};
A.tc=()=>{S.te=null;S.view=null;render()};
A.ts=async()=>{const e=S.te,n=($('#tn').value.trim()||'Шаблон').slice(0,30),ex=e.ex.map(x=>({n:x.n,s:x.s.map(s=>({w:n0(s.w),r:n0(s.r)}))})).filter(x=>x.s.length);
if(!ex.length){say('Добавьте хотя бы одно упражнение с подходом.');return}
const t={id:e.id||Date.now(),n,ex},old=S.tpl;S.tpl=e.id?old.map(x=>x.id===t.id?t:x):old.concat(t);
try{await st.set('tpl',S.tpl);S.te=null;S.view=null;render()}catch(er){S.tpl=old;say('Не удалось сохранить.')}};
A.tdel=()=>ask('Удалить шаблон?',async ok=>{if(!ok)return;const old=S.tpl;S.tpl=old.filter(x=>x.id!==S.te.id);try{await st.set('tpl',S.tpl);S.te=null;S.view=null;render()}catch(e){S.tpl=old;say('Не удалось удалить.')}});
A.pk=()=>{S.pick={g:GR[0]};render()};A.pg=d=>{S.pick.g=d.g;render()};A.pc=()=>{S.pick=null;render()};
A.ae=d=>{T().ex.push({n:d.n,s:prefill(d.n)});S.pick=null;sv();render()};
A.ce=()=>{const n=$('#cn').value.trim().slice(0,40);if(!n)return;S.lib.push({n,g:S.pick.g,q:'своё'});st.set('lib',S.lib).catch(()=>{});A.ae({n})};
A.tk=d=>{const s=S.act.ex[+d.i].s[+d.j];s.k=s.k?0:1;if(s.k)S.rest=Date.now();saveAct();render()};
A.ta=d=>{const e=S.act.ex[+d.i],all=e.s.every(s=>s.k);e.s.forEach(s=>s.k=all?0:1);if(!all)S.rest=Date.now();saveAct();render()};
A.as=d=>{const e=T().ex[+d.i],l=e.s[e.s.length-1]||{};e.s.push({w:l.w||'',r:l.r||'',k:0});sv();render()};
A.ds=d=>{T().ex[+d.i].s.splice(+d.j,1);sv();render()};
A.de=d=>{T().ex.splice(+d.i,1);sv();render()};
A.can=()=>ask('Отменить тренировку?',ok=>{if(!ok)return;clearTimeout(tmr);S.act=null;st.set('tr_active',null).catch(()=>{});render()});
A.fin=async()=>{const a=S.act,ex=a.ex.map(e=>({n:e.n,s:e.s.filter(s=>s.k&&n0(s.r)>0).map(s=>({w:n0(s.w),r:n0(s.r)}))})).filter(e=>e.s.length);
if(!ex.length){say('Отметьте ✓ хотя бы один выполненный подход.');return}
const bm=bestMap(),prs=[];ex.forEach(e=>{const x=Math.max(...e.s.map(s=>s.w*(1+s.r/30)));if(bm[e.n]&&x>bm[e.n].x+.01)prs.push(e.n)});
const w={id:Date.now(),n:a.n,min:Math.max(1,Math.round((Date.now()-a.st)/6e4)),ex,note:(a.note||'').slice(0,80)},d=today(),old=S.tr[d];S.tr[d]=(old||[]).concat(w);
try{await st.set('tr_'+d,S.tr[d]);clearTimeout(tmr);S.act=null;st.set('tr_active',null).catch(()=>{});S.cd=d;render();say('Тренировка сохранена. Объём: '+Math.round(vol(w))+' кг.'+(prs.length?'\n🏆 Новые рекорды: '+prs.join(', '):''))}catch(e){if(old)S.tr[d]=old;else delete S.tr[d];say('Не удалось сохранить тренировку.')}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&!t.disabled&&A[t.dataset.a])A[t.dataset.a](t.dataset,t)});
document.addEventListener('input',e=>{const t=e.target,o=T();if(!o)return;if(t.dataset.f){o.ex[+t.dataset.i].s[+t.dataset.j][t.dataset.f]=t.value;sv()}else if(t.id==='note'&&S.act){S.act.note=t.value;saveAct()}else if(t.id==='tn'&&S.te)S.te.n=t.value});
let tx0=null;document.addEventListener('touchstart',e=>{tx0=e.target.closest('#cal')?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchend',e=>{if(tx0===null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>60)A.cn({v:dx<0?1:-1})});
setInterval(()=>{if(S.act&&S.tab==='train'&&!S.pick&&S.view!=='te'&&$('#tm')){$('#tm').textContent=mm(Date.now()-S.act.st);$('#rt').textContent=S.rest?mm(Date.now()-S.rest):'—'}},1000);
load().then(render).catch(render);
})();
</script></body></html>
